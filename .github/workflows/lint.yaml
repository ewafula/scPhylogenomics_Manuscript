name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            content/*.md
            *.md

  # Spell-checking with cspell was removed: a protocol manuscript in
  # single-cell genomics / phylogenetics carries hundreds of domain terms
  # (e.g., "transcriptomic", "phylogenomics", "aneuploidy", "barcodes",
  # tool names like "FASTA", "GATK", "SECEDO") and maintaining a
  # word-list adds churn without catching real typos.
  #
  # If you want to re-enable it later, paste the block back below and
  # extend `cspell.json` with the project's vocabulary.
